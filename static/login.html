<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ترياق — تسجيل الدخول</title>
<link rel="icon" href="img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/app.css?v=2.3">
<style>
  :root {
    --login-bg: #FAF8F5;
    --login-card: rgba(255, 254, 252, 0.88);
    --login-text: #0F0F0E;
    --login-muted: #68645E;
    --login-border: rgba(20, 20, 19, 0.10);
    --login-input-bg: #FFFFFF;
    --login-accent: #D84315;
    --login-amber: #F59E0B;
    --login-btn: #141413;
    --login-btn-hover: #292826;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    position: relative;
    background-color: var(--login-bg) !important;
    color: var(--login-text) !important;
  }

  /* === Accretion Horizon / Solar Corona Backdrop === */
  .accretion-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: var(--login-bg);
  }

  .accretion-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    background: #000000;
    z-index: 4;
  }

  .accretion-horizon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120vw;
    min-width: 1100px;
    height: 360px;
    z-index: 2;
    overflow: visible;
  }

  .horizon-layer-amber {
    filter: blur(26px);
    transform-origin: 50% 0%;
  }

  .horizon-layer-crimson {
    filter: blur(15px);
    transform-origin: 50% 0%;
  }

  .horizon-layer-core {
    filter: blur(6px);
  }

  .accretion-ambient {
    position: absolute;
    top: -90px;
    left: 50%;
    transform: translateX(-50%);
    width: 78vw;
    min-width: 680px;
    height: 310px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at 50% 0%,
      rgba(245, 158, 11, 0.42) 0%,
      rgba(216, 67, 21, 0.24) 45%,
      rgba(250, 248, 245, 0) 78%
    );
    filter: blur(36px);
    z-index: 1;
  }

  .login-card {
    width: min(410px, 92vw);
    background: var(--login-card);
    border: 1px solid var(--login-border);
    border-radius: 22px;
    box-shadow:
      0 24px 48px -12px rgba(20, 15, 10, 0.08),
      0 4px 16px -2px rgba(0, 0, 0, 0.04),
      0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    padding: 34px 32px 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    z-index: 10;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    margin-top: 72px;
  }

  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .login-brand .logo-wrap {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #F7F3EE 100%);
    border: 1px solid rgba(20, 20, 19, 0.1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 10px 24px -6px rgba(0, 0, 0, 0.08),
      0 2px 6px rgba(0, 0, 0, 0.04);
    padding: 8px;
  }

  .login-brand .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
  }

  .login-brand-text h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--login-text);
    line-height: 1.2;
  }

  .login-brand-text p {
    margin: 4px 0 0;
    color: var(--login-muted);
    font-size: 13.5px;
    font-weight: 500;
  }

  .login-card form { display: flex; flex-direction: column; gap: 15px; }

  .login-card .field label {
    color: #262523;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
  }

  .login-card .field input {
    width: 100%;
    background: var(--login-input-bg) !important;
    color: var(--login-text) !important;
    border: 1px solid rgba(20, 20, 19, 0.14) !important;
    border-radius: 11px !important;
    padding: 11px 14px !important;
    font-size: 14px;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }

  .login-card .field input:focus {
    outline: none !important;
    border-color: var(--login-accent) !important;
    box-shadow: 0 0 0 3px rgba(20, 20, 19, 0.08) !important;
  }

  .login-card .btn.primary {
    justify-content: center;
    padding: 12.5px 20px;
    background: var(--login-btn) !important;
    color: #FFFFFF !important;
    border: 1px solid #000000 !important;
    border-radius: 11px !important;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
      0 8px 18px -4px rgba(20, 20, 19, 0.28),
      0 1px 0 rgba(255, 255, 255, 0.14) inset !important;
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .login-card .btn.primary:hover {
    background: var(--login-btn-hover) !important;
    transform: translateY(-1px);
    box-shadow:
      0 12px 24px -4px rgba(20, 20, 19, 0.28),
      0 4px 10px rgba(0, 0, 0, 0.14) !important;
  }

  .login-card .btn.primary:active { transform: translateY(0); }
  #err { color: #C81E1E; font-size: 13px; text-align: center; min-height: 18px; font-weight: 600; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ترياق">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D84315"></head>
<body>
<div class="accretion-bg" aria-hidden="true">
  <div class="accretion-top-bar"></div>
  <div class="accretion-ambient" id="accretion-ambient"></div>
  <svg class="accretion-horizon" id="accretion-horizon" viewBox="0 0 1440 340" preserveAspectRatio="none">
    <defs>
      <linearGradient id="amber-band" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0" />
        <stop offset="18%" stop-color="#F59E0B" stop-opacity="0.78" />
        <stop offset="50%" stop-color="#EA580C" stop-opacity="1" />
        <stop offset="82%" stop-color="#F59E0B" stop-opacity="0.78" />
        <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="crimson-band" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="5%" stop-color="#7C0A02" stop-opacity="0.2" />
        <stop offset="25%" stop-color="#9A1B00" stop-opacity="0.95" />
        <stop offset="50%" stop-color="#6B0500" stop-opacity="1" />
        <stop offset="75%" stop-color="#9A1B00" stop-opacity="0.95" />
        <stop offset="95%" stop-color="#7C0A02" stop-opacity="0.2" />
      </linearGradient>
    </defs>
    <path class="horizon-layer-amber" fill="url(#amber-band)"
          d="M -60,28 C 220,28 380,248 720,248 C 1060,248 1220,28 1500,28 L 1500,0 L -60,0 Z" />
    <path class="horizon-layer-crimson" fill="url(#crimson-band)"
          d="M -60,30 C 250,30 410,208 720,208 C 1030,208 1190,30 1500,30 L 1500,0 L -60,0 Z" />
    <path class="horizon-layer-core" fill="#000000"
          d="M -60,32 C 280,32 435,168 720,168 C 1005,168 1160,32 1500,32 L 1500,0 L -60,0 Z" />
  </svg>
</div>
<div class="login-card">
  <div class="login-brand">
    <span class="logo-wrap" aria-hidden="true">
      <img src="img/logo.png" alt="ترياق">
    </span>
    <div class="login-brand-text">
      <h1>تِــريَــاق</h1>
      <p>نظام إدارة الصيدلية الذكي</p>
    </div>
  </div>
  <form id="f">
    <div class="field"><label for="username-input">اسم المستخدم</label>
      <input type="text" name="username" id="username-input" autocomplete="username" required autofocus></div>
    <div class="field" style="position:relative">
      <label for="pwd-input">كلمة المرور</label>
      <input type="password" name="password" id="pwd-input" autocomplete="current-password" required style="padding-left: 42px;">
      <button type="button" id="toggle-pwd" aria-label="إظهار أو إخفاء كلمة المرور" title="إظهار أو إخفاء كلمة المرور" style="position:absolute; left:8px; bottom:7px; background:none; border:none; cursor:pointer; padding:6px; color:var(--login-muted); display:flex; align-items:center; justify-content:center;">
        <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div id="err" role="alert"></div>
    <button class="btn primary" type="submit">تسجيل الدخول</button>
  </form>
  <div style="
    margin-top: 6px;
    padding-top: 16px;
    border-top: 1px solid var(--login-border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
  ">
    <span style="color: var(--login-muted); font-size: 12.5px;">بالدخول فأنت توافق على</span>
    <a href="terms.html" style="
      color: var(--login-muted);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.18s;
    " onmouseover="this.style.color='var(--login-accent)'" onmouseout="this.style.color='var(--login-muted)'">
      شروط الاستخدام
    </a>
    <span style="color: var(--login-muted); font-size: 12.5px;">و</span>
    <a href="privacy.html" style="
      color: var(--login-muted);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.18s;
    " onmouseover="this.style.color='var(--login-accent)'" onmouseout="this.style.color='var(--login-muted)'">
      سياسة الخصوصية
    </a>
  </div>
</div>
<script>
  const err = document.getElementById("err");

  // Toggle password visibility
  const togglePwdBtn = document.getElementById("toggle-pwd");
  const pwdInput = document.getElementById("pwd-input");
  const eyeIcon = document.getElementById("eye-icon");
  if (togglePwdBtn && pwdInput && eyeIcon) {
    togglePwdBtn.onclick = () => {
      const isPwd = pwdInput.type === "password";
      pwdInput.type = isPwd ? "text" : "password";

      // تبديل الأيقونة بين العين (عرض) والمغلق (إخفاء)
      eyeIcon.innerHTML = isPwd
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    };
  }

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = ""; // Clear error before each attempt
    const fd = new FormData(e.target);
    try {
      const res = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error === "invalid credentials" ? "بيانات الدخول غير صحيحة" : (data.error || "حدث خطأ"); return; }
      // Success - redirect will clear the error naturally
      location.href = "index.html";
    } catch { err.textContent = "تعذر الاتصال بالخادم"; }
  };

  // Subtle horizon breathing animation
  document.addEventListener("DOMContentLoaded", () => {
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced || !window.gsap) return;
    gsap.to("#accretion-ambient", {
      scaleX: 1.06,
      scaleY: 1.08,
      opacity: 0.85,
      duration: 5,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  });
</script>
</body>
</html>
