<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تِــريَــاق — الإدارة والإعدادات</title>
<link rel="stylesheet" href="css/app.css?v=2.3">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/design-system.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ترياق">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2572c"></head>
<body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="js/app.js?v=2.2"></script>
<script>
boot("الإدارة والإعدادات", async (user, el) => {
  if (user.role !== "admin") { el.innerHTML = '<div class="empty">عذراً، هذه الصفحة للمديرين فقط</div>'; return; }

  el.innerHTML = `
  <div class="tabs">
    <button class="active" onclick="switchTab('users', this)">المستخدمين</button>
    <button onclick="switchTab('branches', this)">الفروع</button>
    <button onclick="switchTab('categories', this)">تصنيفات الأدوية</button>
    <button onclick="switchTab('exchange_rate', this)">سعر الصرف (الدولار)</button>
    <button onclick="switchTab('loyalty', this)">الولاء والمكافآت</button>
    <button onclick="switchTab('audit', this)">سجل العمليات</button>
    <button onclick="switchTab('backup', this)">النسخ الاحتياطي</button>
    <button onclick="switchTab('drug_api', this)">ربط المستودع (API)</button>
    <button onclick="switchTab('support', this)">دعم التواصل</button>
  </div>
  <div id="tab-content"></div>`;

  async function loadUsers() {
    const [data, lic] = await Promise.all([
      api("/api/users"),
      api("/api/license/status").catch(() => null)
    ]);
    const us = data.users || [];

    let licBanner = "";
    if (lic) {
      const isValid = lic.is_valid;
      const isLifetime = lic.is_lifetime;
      const days = typeof lic.days_remaining === "number" ? lic.days_remaining : null;
      const expDate = lic.expires_at;
      const client = lic.client_name || "الصيدلية";

      let statusColor = "var(--ok)";
      let badgeHtml = "";
      let durationValueHtml = "";
      let durationSubtext = "";

      if (!isValid) {
        statusColor = "var(--danger)";
        badgeHtml = `<span class="pill danger" style="font-size:11.5px; font-weight:700; padding:2px 10px;">منتهي</span>`;
        durationValueHtml = `<div style="font-size:16px; font-weight:800; color:var(--danger);">منتهي الصلاحية</div>`;
        durationSubtext = "يرجى التجديد للاستمرار دون توقف";
      } else if (isLifetime) {
        statusColor = "var(--ok)";
        badgeHtml = `<span class="pill ok" style="font-size:11.5px; font-weight:700; padding:2px 10px;">دائم ♾️</span>`;
        durationValueHtml = `<div style="font-size:16px; font-weight:800; color:var(--ok); display:flex; align-items:center; gap:6px;"><span>مدى الحياة (دائم)</span> <span style="font-size:18px;">♾️</span></div>`;
        durationSubtext = "ترخيص مفتوح غير مقيد بتاريخ انتهاء";
      } else if (days !== null && days <= 7) {
        statusColor = "var(--danger)";
        badgeHtml = `<span class="pill danger" style="font-size:11.5px; font-weight:700; padding:2px 10px;">ينتهي خلال ${days} أيام</span>`;
        durationValueHtml = `<div style="font-size:20px; font-weight:800; color:var(--danger);">${days} <span style="font-size:13px; font-weight:600;">أيام فقط</span></div>`;
        durationSubtext = `ينتهي في ${esc(expDate || "-")} (تجديد عاجل)`;
      } else if (days !== null && days <= 30) {
        statusColor = "var(--warn)";
        badgeHtml = `<span class="pill warn" style="font-size:11.5px; font-weight:700; padding:2px 10px;">ينتهي قريباً</span>`;
        durationValueHtml = `<div style="font-size:20px; font-weight:800; color:var(--warn);">${days} <span style="font-size:13px; font-weight:600;">يوماً</span></div>`;
        durationSubtext = `تاريخ الانتهاء: ${esc(expDate || "-")}`;
      } else {
        statusColor = "var(--ok)";
        badgeHtml = `<span class="pill ok" style="font-size:11.5px; font-weight:700; padding:2px 10px;">ساري ونشط</span>`;
        durationValueHtml = `<div style="font-size:20px; font-weight:800; color:var(--ok);">${days !== null ? days : '-'} <span style="font-size:13px; font-weight:600;">يوماً</span></div>`;
        durationSubtext = `تاريخ الانتهاء: ${esc(expDate || "-")}`;
      }

      licBanner = `
        <div class="card" style="margin-bottom:16px; padding:18px 20px; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; padding-bottom:14px; border-bottom:1px solid var(--border);">
            <div style="display:flex; align-items:center; gap:12px;">
              <div style="width:44px; height:44px; border-radius:12px; background:color-mix(in srgb, ${statusColor} 12%, transparent); color:${statusColor}; display:grid; place-items:center; flex-shrink:0;">
                ${isLifetime ? icon("check") : (days !== null && days <= 30 ? icon("alert") : icon("clock"))}
              </div>
              <div>
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <h3 style="margin:0; font-size:16px; font-weight:800; color:var(--text);">${esc(client)}</h3>
                  ${badgeHtml}
                </div>
                <div style="font-size:12px; color:var(--muted); margin-top:2px;">
                  حالة اشتراك وترخيص نظام تِــريَــاق
                </div>
              </div>
            </div>
            <div>
              <a href="/activate.html" class="btn primary sm" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-weight:700; padding:8px 16px; border-radius:8px;">
                ${icon("refresh")} <span>تجديد / تفعيل الترخيص</span>
              </a>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:12px; margin-top:14px;">
            <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; justify-content:center;">
              <span style="font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:4px;">المدة المتبقية على الاشتراك</span>
              ${durationValueHtml}
              <span style="font-size:11px; color:var(--muted); margin-top:4px;">${durationSubtext}</span>
            </div>

            <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; justify-content:center;">
              <span style="font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:4px;">نطاق التفعيل والفروع</span>
              <div style="font-size:15px; font-weight:800; color:var(--text);">${lic.max_branches > 1 ? lic.max_branches + ' فروع مصرحة' : 'فرع واحد (نسخة محلية)'}</div>
              <span style="font-size:11px; color:var(--ok); font-weight:600; margin-top:4px;">✓ متصل ويعمل بصورة طبيعية</span>
            </div>

            <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; justify-content:center;">
              <span style="font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:4px;">كود تعريف الجهاز (HWID)</span>
              <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
                <span class="mono" style="font-size:12.5px; font-weight:700; color:var(--primary);">${esc(lic.machine_id || "غير معروف")}</span>
                <button type="button" class="btn sm ghost" style="padding:2px 8px; font-size:11px; height:auto; line-height:1.6;" onclick="navigator.clipboard.writeText('${esc(lic.machine_id)}'); toast('تم نسخ كود الجهاز بنجاح');" title="نسخ الكود">نسخ</button>
              </div>
              <span style="font-size:11px; color:var(--muted); margin-top:4px;">يُطلب عند تجديد الاشتراك أو الترقية</span>
            </div>
          </div>
        </div>
      `;
    }

    $("#tab-content").innerHTML = `
      ${licBanner}
      <div class="toolbar" style="margin-bottom:12px"><button type="button" class="btn primary" onclick="openAddUser()">${icon("plus")}<span>إضافة مستخدم</span></button></div>
      <div class="card">
        ${tableHTML([
          { label: "المستخدم", key: "username", render: (r) => {
              const isMe = r.id === user.id || r.username === user.username;
              return `<span style="font-weight:600;">${esc(r.username)}</span>` +
                     (isMe ? ` <span class="pill info sm" style="font-size:11px; margin-right:4px;">حسابك الحالي</span>` : "");
          }},
          { label: "الاسم الكامل", key: "full_name" },
          { label: "الدور", key: "role", render: (r) => esc({ admin: "مدير", pharmacist: "صيدلي", sales: "بائع" }[r.role] || r.role) },
          { label: "الحالة", render: (r) => `<span class="pill ${r.active ? "ok" : "danger"}">${r.active ? "نشط" : "معطل"}</span>` },
          { label: "تاريخ الإنشاء", render: (r) => esc((r.created_at || "").slice(0, 10)) },
          { label: "إجراءات", key: "actions", num: false, render: (r) => {
              if (user.role !== 'admin') return '';
              const isMe = r.id === user.id || r.username === user.username;
              const isSeedAdmin = r.id === 1 || r.username === "admin";

              let actions = `
                <button type="button" class="btn sm" onclick="editUser(${r.id})" title="تعديل المستخدم" aria-label="تعديل المستخدم">${icon("edit")}</button>
                <button type="button" class="btn sm" onclick="openUserPassword(${r.id}, '${esc(r.full_name || r.username)}')" title="تغيير كلمة المرور" aria-label="تغيير كلمة المرور">${icon("lock")} كلمة المرور</button>
              `;

              if (isMe) {
                actions += `<button type="button" class="btn sm" disabled style="opacity:0.35; cursor:not-allowed;" title="لا يمكنك تعطيل حسابك الإداري الحالي المسجل به" aria-label="لا يمكنك تعطيل حسابك الحالي">${icon("pause")}</button>`;
              } else if (isSeedAdmin) {
                actions += `<button type="button" class="btn sm" disabled style="opacity:0.35; cursor:not-allowed;" title="لا يمكن تعطيل المدير الرئيسي للنظام" aria-label="لا يمكن تعطيل المدير الرئيسي">${icon("pause")}</button>`;
              } else {
                actions += `<button type="button" class="btn sm" onclick="suspendUser(${r.id})" title="${r.active ? 'تعطيل الحساب' : 'تفعيل الحساب'}" aria-label="${r.active ? 'تعطيل الحساب' : 'تفعيل الحساب'}">${r.active ? icon("pause"): icon("play")}</button>`;
              }

              if (isMe) {
                actions += `<button type="button" class="btn sm ghost" disabled style="opacity:0.25; cursor:not-allowed;" title="لا يمكنك حذف حسابك الحالي" aria-label="لا يمكنك حذف حسابك الحالي">${icon("trash")}</button>`;
              } else if (isSeedAdmin) {
                actions += `<button type="button" class="btn sm ghost" disabled style="opacity:0.25; cursor:not-allowed;" title="لا يمكن حذف المدير الرئيسي للنظام" aria-label="لا يمكن حذف المدير الرئيسي للنظام">${icon("trash")}</button>`;
              } else {
                actions += `<button type="button" class="btn sm ghost danger" onclick="deleteUser(${r.id})" title="حذف المستخدم" aria-label="حذف المستخدم">${icon("trash")}</button>`;
              }

              if (r.warning_msg) {
                  actions += `<button type="button" class="btn sm ghost warn" onclick="viewWarning(${r.id})" title="عرض التحذير" aria-label="عرض التحذير">${icon("alert")}</button>`;
              }
              return actions;
          }},
        ], us, "لا يوجد مستخدمين مسجلين")}
      </div>
      <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end">
        <button type="button" class="btn danger" onclick="openResetSystem()">${icon("alert")}<span>إعادة ضبط النظام</span></button>
      </div>`;
  }

  async function loadBranches() {
    const data = await api("/api/branches");
    const bs = data.branches || [];
    const maxBranches = data.max_branches || 1;
    const isAtLimit = bs.length >= maxBranches;

    $("#tab-content").innerHTML = `
      <div class="toolbar" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <button type="button" class="btn primary" onclick="openAddBranch(${bs.length}, ${maxBranches})">${icon("plus")}<span>إضافة فرع</span></button>
        <span class="pill ${isAtLimit ? 'warn' : 'ok'}" style="font-size:12px; font-weight:700; padding:4px 12px; display:inline-flex; align-items:center; gap:6px;">
          <span>الفروع المسجلة: <b>${bs.length}</b> من أصل <b>${maxBranches}</b> مصرح بها</span>
          ${isAtLimit ? '<span style="font-size:11px; opacity:0.85;">(الحد الأقصى للترخيص)</span>' : ''}
        </span>
      </div>
      <div class="card">
        ${tableHTML([
          { label: "الفرع", key: "name" },
          { label: "الهاتف", key: "phone" },
          { label: "العنوان", key: "address" },
        ], bs)}
      </div>`;
  }

  const AUDIT_ACTIONS = {
    // Sales & Customers
    create_sale: { text: "تسجيل فاتورة بيع", type: "ok" },
    cancel_sale: { text: "إلغاء فاتورة بيع", type: "danger" },
    return_sale: { text: "مرتجع مبيعات", type: "warn" },
    customer_return: { text: "مرتجع عميل", type: "warn" },
    customer_return_bulk: { text: "إرجاع أصناف مبيعات", type: "warn" },
    create_customer: { text: "تسجيل عميل جديد", type: "ok" },
    update_customer: { text: "تعديل بيانات عميل", type: "info" },
    delete_customer: { text: "حذف عميل", type: "danger" },

    // Purchases & Suppliers
    create_purchase: { text: "تسجيل فاتورة مشتريات", type: "ok" },
    create_supplier: { text: "إضافة مورد جديد", type: "ok" },
    update_supplier: { text: "تعديل بيانات مورد", type: "info" },
    delete_supplier: { text: "حذف مورد", type: "danger" },
    pay_supplier: { text: "سداد دفعة للمورد", type: "info" },

    // Products & Inventory
    create_product: { text: "إضافة دواء جديد", type: "ok" },
    update_product: { text: "تعديل بيانات دواء", type: "info" },
    delete_product: { text: "حذف دواء", type: "danger" },
    import_products: { text: "استيراد أدوية من ملف", type: "ok" },
    import_external_product: { text: "استيراد من مستودع الأدوية", type: "ok" },
    add_batch: { text: "إضافة دفعة تشغيلة", type: "ok" },
    adjust_inventory: { text: "تعديل رصيد المخزون", type: "warn" },
    update_branch_limits: { text: "تحديث حدود المخزون", type: "info" },

    // Categories
    create_category: { text: "إضافة تصنيف أدوية", type: "ok" },
    update_category: { text: "تعديل تصنيف أدوية", type: "info" },
    delete_category: { text: "حذف تصنيف أدوية", type: "danger" },

    // Users & Authentication
    login: { text: "تسجيل دخول", type: "info" },
    logout: { text: "تسجيل خروج", type: "info" },
    create_user: { text: "إنشاء مستخدم جديد", type: "ok" },
    update_user: { text: "تعديل بيانات مستخدم", type: "info" },
    delete_user: { text: "حذف مستخدم", type: "danger" },
    suspend_user: { text: "تعطيل حساب مستخدم", type: "danger" },
    unsuspend_user: { text: "تفعيل حساب مستخدم", type: "ok" },
    deactivate_user: { text: "إلغاء تنشيط مستخدم", type: "danger" },
    warn_user: { text: "إرسال تحذير إداري", type: "warn" },
    change_password: { text: "تغيير كلمة المرور", type: "info" },
    change_user_password: { text: "تغيير كلمة مرور مستخدم", type: "info" },

    // Promotions & Loyalty
    create_promotion: { text: "إنشاء عرض ترويجي", type: "ok" },
    update_promotion: { text: "تعديل عرض ترويجي", type: "info" },
    delete_promotion: { text: "حذف عرض ترويجي", type: "danger" },
    approve_promotion: { text: "اعتماد عرض ترويجي", type: "ok" },
    reject_promotion: { text: "رفض عرض ترويجي", type: "danger" },
    update_loyalty_settings: { text: "تحديث إعدادات الولاء", type: "info" },
    create_reward: { text: "إضافة مكافأة ولاء", type: "ok" },
    deactivate_reward: { text: "تعطيل مكافأة ولاء", type: "danger" },
    redeem_product: { text: "استبدال نقاط بمكافأة", type: "ok" },

    // Product Requests
    create_product_request: { text: "تسجيل طلب منتج", type: "ok" },
    update_request_status: { text: "تحديث حالة طلب منتج", type: "info" },
    delete_product_request: { text: "حذف طلب منتج", type: "danger" },

    // Expenses & Shifts
    create_expense: { text: "تسجيل مصروف", type: "warn" },
    delete_expense: { text: "حذف مصروف", type: "danger" },
    open_shift: { text: "فتح وردية جديدة", type: "ok" },
    close_shift: { text: "تقفيل وإغلاق وردية", type: "info" },

    // Branches & System
    create_branch: { text: "إنشاء فرع جديد", type: "ok" },
    update_branch: { text: "تعديل بيانات فرع", type: "info" },
    backup: { text: "إنشاء نسخة احتياطية", type: "info" },
    restore: { text: "استعادة نسخة احتياطية", type: "warn" },
    restore_backup: { text: "استعادة نسخة احتياطية", type: "warn" },
    sync_pull: { text: "مزامنة سحب بيانات", type: "info" },
    sync_push: { text: "مزامنة رفع بيانات", type: "info" },
    reset_system: { text: "إعادة ضبط النظام", type: "danger" },
    update_settings: { text: "تحديث إعدادات النظام", type: "info" }
  };

  const AUDIT_TABLES = {
    users: "المستخدمين",
    products: "الأدوية والمخزون",
    suppliers: "الموردين",
    supplier_payments: "مدفوعات الموردين",
    purchases: "المشتريات",
    sales: "المبيعات",
    sale_items: "بنود الفواتير",
    promotions: "العروض الترويجية",
    inventory_adjustments: "تعديلات المخزون",
    batches: "الدفعات والتشغيلات",
    expenses: "المصروفات",
    categories: "تصنيفات الأدوية",
    returns: "المرتجعات",
    branches: "الفروع",
    product_requests: "طلبات المنتجات",
    settings: "إعدادات النظام",
    loyalty_rewards: "مكافآت الولاء",
    loyalty_ledger: "سجل نقاط الولاء",
    shifts: "الورديات والصندوق"
  };

  async function loadAudit() {
    const userData = await api("/api/users");
    const users = (userData.users || []).filter(u => u.active);
    const userOptions = `<option value="">كل المستخدمين</option>` +
      users.map(u => `<option value="${u.id}">${esc(u.full_name || u.username)}</option>`).join("");

    const actionOptions = `<option value="">كل العمليات</option>` +
      Object.entries(AUDIT_ACTIONS).map(([k, v]) => `<option value="${k}">${esc(v.text)}</option>`).join("");

    $("#tab-content").innerHTML = `
      <div class="card">
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:flex-end;">
          <div class="field" style="margin:0; flex:1; min-width:160px">
            <label>تصفية بالمستخدم</label>
            <select id="filter-user">${userOptions}</select>
          </div>
          <div class="field" style="margin:0; flex:1; min-width:180px">
            <label>نوع العملية</label>
            <select id="filter-action">${actionOptions}</select>
          </div>
          <div class="field" style="margin:0">
            <label>من تاريخ</label>
            <input type="date" id="filter-date-from">
          </div>
          <div class="field" style="margin:0">
            <label>إلى تاريخ</label>
            <input type="date" id="filter-date-to">
          </div>
          <button class="btn primary" id="btn-apply-filter" onclick="applyAuditFilters()">${icon("search")}<span>تطبيق الفلتر</span></button>
          <button class="btn" onclick="clearAuditFilters()">${icon("refresh")}<span>مسح</span></button>
        </div>
        <div id="audit-table"></div>
      </div>`;
    // Load all on initial tab open
    applyAuditFilters();
  }

  async function applyAuditFilters() {
    const userId = document.getElementById("filter-user")?.value || "";
    const action = document.getElementById("filter-action")?.value || "";
    const dateFrom = document.getElementById("filter-date-from")?.value || "";
    const dateTo = document.getElementById("filter-date-to")?.value || "";

    }
  } catch (e) {

      resEl.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:10px; background:var(--danger-bg); border:1px solid var(--danger); color:var(--danger); font-size:13px; font-weight:600;">

  }
};

  window.uploadBackup = async (input) => {
    const file = input.files[0];
    input.value = "";
    if (!file) return;

    const ring = showProgressRing({
      title: "رفع نسخة احتياطية من جهازك",
      subtitle: `${file.name} (${(file.size / 1024).toFixed(1)} KB)`,
      iconType: "upload",
      stages: [
        { pct: 20, label: "إرسال حزمة الملف إلى السيرفر" },
        { pct: 80, label: "فحص بنية وصيغة النسخة الاحتياطية" },
        { pct: 100, label: "اكتمال الرفع وحفظ النسخة في النظام" }
      ],
      initialPercent: 5
    });

    try {
      const fd = new FormData();
      fd.append("file", file);

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/backups/upload");
        const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute("content");
        if (csrf) xhr.setRequestHeader("X-CSRF-Token", csrf);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const uploadPct = Math.round((e.loaded / e.total) * 75);
            const loadedKB = (e.loaded / 1024).toFixed(0);
            const totalKB = (e.total / 1024).toFixed(0);
            ring.setProgress(uploadPct, `جاري رفع الملف (${loadedKB} / ${totalKB} KB)...`, 0);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            ring.setProgress(90, "التحقق من صحة ملف النسخة وتشفيره...", 1);
            setTimeout(() => {
              ring.setSuccess("تم رفع النسخة الاحتياطية وحفظها بنجاح!");
              setTimeout(async () => {
                await ring.close();
                resolve();
              }, 1200);
            }, 300);
          } else {
            try {
              const errData = JSON.parse(xhr.responseText);
              reject(new Error(errData.error || "فشل رفع الملف"));
            } catch (e) {
              reject(new Error(`خطأ في الرفع: ${xhr.statusText || xhr.status}`));
            }
          }
        };

        xhr.onerror = () => reject(new Error("انقطع الاتصال أثناء رفع الملف"));
        xhr.send(fd);
      });

      toast("تم رفع النسخة. اضغط «استعادة» بجانبها لاسترجاع بياناتها.");
      loadBackup();
    } catch (e) {
      ring.setError(e.message);
    }
  };

      modal("تنبيه: الحد الأقصى للفروع", `
        <div style="padding:14px; text-align:center;">
          <div style="width:48px; height:48px; border-radius:50%; background:var(--warning-bg); color:var(--warn); display:grid; place-items:center; margin:0 auto 12px;">
            ${icon("alert")}
          </div>
          <h4 style="margin:0 0 8px; font-size:16px;">تم بلوغ الحد الأقصى للفروع</h4>
          <p style="font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 16px;">
            باقة ترخيصك الحالية تدعم <b>${maxAllowed} فرع</b> فقط، وتم استنفاد هذا العدد.<br>
            لإضافة فروع إضافية، يرجى ترقية باقة الترخيص أو التواصل مع الدعم الفني.
          </p>
          <div style="display:flex; justify-content:center; gap:8px;">
            <a href="/activate.html" class="btn primary sm" style="text-decoration:none; padding:8px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;">
              ${icon("refresh")} <span>ترقية / تفعيل الترخيص</span>
            </a>
          </div>
        </div>
      `, null, "إغلاق");
      return;
    }

    modal("إضافة فرع جديد", `
      <div class="form-grid">
        <div class="field"><label>اسم الفرع *</label><input type="text" name="name" required></div>
        <div class="field"><label>الهاتف</label><input type="text" name="phone"></div>
        <div class="field"><label>العنوان</label><input type="text" name="address"></div>
      </div>
    `, async (fd) => {
      await api("/api/branches", { method: "POST", body: JSON.stringify(fd) });
      toast("تمت إضافة الفرع بنجاح");
      loadBranches();
    });
  };

  window.openResetSystem = () => {
    modal("⚠️ إعادة ضبط النظام بالكامل", `
      <div style="padding:12px;background:var(--danger-bg);border-radius:10px;margin-bottom:12px">
        <p style="margin:0;font-weight:bold">تحذير: سيتم حذف جميع بيانات النظام باستثناء</p>
        <ul style="margin:8px 0 0; padding-right:20px;font-size:13px">
          <li>بيانات المستخدمين (admins, pharmacists)</li>
          <li>بيانات الفروع</li>
          <li>البيانات الحكومية والالتزامات</li>
        </ul>
      </div>
      <div style="display:flex;gap:12px;flex-direction:column">
        <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="reset-pwd1" required></div>
        <div class="field"><label>تأكيد كلمة المرور</label><input type="password" id="reset-pwd2" required></div>
      </div>
      <div id="reset-error" style="color:var(--danger);font-size:12px;margin:8px 0 0"></div>
    `, async () => {
      const pwd1 = document.getElementById("reset-pwd1").value;
      const pwd2 = document.getElementById("reset-pwd2").value;
      const errorEl = document.getElementById("reset-error");

      if (!pwd1) { errorEl.textContent = "أدخل كلمة المرور"; throw new Error("أدخل كلمة المرور"); }
      if (pwd1 !== pwd2) { errorEl.textContent = "كلمات المرور غير متطابقة"; throw new Error("كلمات المرور غير متطابقة"); }

      if (!(await showPopupConfirm("⚠️ هل أنت متأكد تماماً؟ هذا الإجراء لا يمكن التراجع عنه!", "تأكيد إعادة ضبط النظام"))) {
        throw new Error("تم إلغاء العملية");
      }

      await api("/api/system/reset", {
        method: "POST",
        body: JSON.stringify({ password: pwd1 })
      });
      toast("تمت إعادة ضبط النظام بنجاح");
      setTimeout(() => location.reload(), 1500);
    }, "إعادة الضبط");
    $("#modal-ok")?.classList.add("danger");
  };

  loadUsers();
});
</script>
</body>
</html>
